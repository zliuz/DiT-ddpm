[project]
name = "dit-ddpm"
version = "0.1.0"
description = "Learn DDPM from scratch with a tiny diffusion Transformer on MNIST."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "tqdm>=4.67,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
